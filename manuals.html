<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>产品说明书 | YQ2401-05 涡旋振荡仪</title>
<link rel="stylesheet" href="style.css">
<script>
  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');

    var targetFrame = document.getElementById('frame-' + tab);
    document.querySelectorAll('.viewer iframe').forEach(f => {
      f.classList.remove('active');
      f.style.display = 'none';
    });
    targetFrame.classList.add('active');
    targetFrame.style.display = 'block';

    document.querySelectorAll('.viewer-fallback').forEach(d => d.classList.remove('show'));

    var label = document.getElementById('viewer-label');
    if (tab === 'en') {
      label.innerHTML = '📄 [PDF 1] &mdash; English Manual';
      label.className = 'viewer-label';
    } else {
      label.innerHTML = '📄 [PDF 2] &mdash; 中文说明书';
      label.className = 'viewer-label cn';
    }
  }
</script>
</head>
<body>

  <div class="topbar">
    <a class="back" href="index.html">‹ 返回首页</a>
    <span class="title">产品说明书</span>
  </div>

  <main class="wrap wide" style="padding-top:24px">

    <div class="tab-bar">
      <button class="tab-btn active" id="tab-en" onclick="switchTab('en')">
        🇬🇧 English Manual <span class="tab-badge en">PDF 1</span>
      </button>
      <button class="tab-btn" id="tab-cn" onclick="switchTab('cn')">
        🇨🇳 中文说明书 <span class="tab-badge cn">PDF 2</span>
      </button>
    </div>

    <div class="viewer-label" id="viewer-label">📄 [PDF 1] &mdash; English Manual</div>

    <div class="viewer">
      <iframe
        id="frame-en"
        src="./YQ2401-05_Vortex_Mixer_Manual_EN20260902.pdf"
        class="active"
        onerror="document.getElementById('fallback-en').classList.add('show')"
        onload="this.style.display='block'; document.getElementById('fallback-en').classList.remove('show')">
      </iframe>
      <iframe
        id="frame-cn"
        src="./YQ2401-05涡旋振荡仪产品说明书-250902.pdf"
        onerror="document.getElementById('fallback-cn').classList.add('show')"
        onload="this.style.display='block'; document.getElementById('fallback-cn').classList.remove('show')">
      </iframe>

      <div class="viewer-fallback" id="fallback-en">
        <span class="fallback-icon">📄</span>
        <h3>PDF 1 &mdash; English Manual</h3>
        <p>YQ2401-05 Vortex Mixer Manual (EN)</p>
        <a class="action primary" href="./YQ2401-05_Vortex_Mixer_Manual_EN20260902.pdf" download>下载 English Manual</a>
      </div>
      <div class="viewer-fallback" id="fallback-cn">
        <span class="fallback-icon">📄</span>
        <h3>PDF 2 &mdash; 中文说明书</h3>
        <p>YQ2401-05 涡旋振荡仪产品说明书</p>
        <a class="action primary" href="./YQ2401-05涡旋振荡仪产品说明书-250902.pdf" download>下载中文说明书</a>
      </div>
    </div>

    <div class="download-section">
      <p>如果浏览器不支持 PDF 预览，请直接下载：</p>
      <div class="download-btns">
        <a class="action primary" href="./YQ2401-05_Vortex_Mixer_Manual_EN20260902.pdf" download>📥 下载 PDF 1 (English)</a>
        <a class="action ghost" href="./YQ2401-05涡旋振荡仪产品说明书-250902.pdf" download>📥 下载 PDF 2 (中文)</a>
      </div>
    </div>

  </main>

  <footer class="footer">
    <div class="brand">上海泉心品生物科技有限公司</div>
    <div>Hosted on <a href="https://github.com/jingjingblackpink/Vortex_Mixer_Manual">GitHub</a> &middot; Powered by GitHub Pages</div>
  </footer>

</body>
</html>
